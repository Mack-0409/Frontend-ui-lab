<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | InkScribe</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- TailwindCSS (Play CDN, preflight disabled to avoid Bootstrap conflicts) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { corePlugins: { preflight: false } };
  </script>
  <!-- Font Awesome icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <!-- Custom CSS -->
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body class="auth-body">

  <!-- ================= NAVBAR ================= -->
  <nav class="navbar navbar-expand-lg navbar-light site-nav sticky-top" id="siteNav">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
        <span class="brand-mark"><i class="fa-solid fa-feather-pointed"></i></span>
        <span class="brand-name">Ink<span>Scribe</span></span>
      </a>
      <div class="d-flex gap-2">
        <a href="index.html" class="btn btn-outline-dark"><i class="fa-solid fa-house me-1"></i>Home</a>
      </div>
    </div>
  </nav>

  <!-- ================= LOGIN CARD ================= -->
  <main class="auth-wrapper">
    <div class="auth-card rounded-4 shadow-lg">
      <div class="text-center mb-4">
        <div class="auth-icon rounded-circle mx-auto d-flex align-items-center justify-content-center">
          <i class="fa-solid fa-user-lock"></i>
        </div>
        <h2 class="auth-title mt-3 mb-1">Welcome back</h2>
        <p class="text-muted mb-0">Log in to continue reading &amp; writing</p>
      </div>

      <form id="loginForm" novalidate>
        <!-- Email -->
        <div class="mb-3">
          <label for="loginEmail" class="form-label">Email address</label>
          <div class="input-group">
            <span class="input-group-text"><i class="fa-solid fa-envelope"></i></span>
            <input type="email" class="form-control" id="loginEmail" placeholder="you@example.com" autocomplete="email" required />
          </div>
          <div class="invalid-feedback">Please enter a valid email address.</div>
        </div>

        <!-- Password -->
        <div class="mb-3">
          <label for="loginPassword" class="form-label">Password</label>
          <div class="input-group">
            <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
            <input type="password" class="form-control" id="loginPassword" placeholder="Enter your password" autocomplete="current-password" required minlength="6" />
            <button type="button" class="input-group-text btn btn-outline-secondary toggle-pass" data-target="loginPassword">
              <i class="fa-solid fa-eye"></i>
            </button>
          </div>
          <div class="invalid-feedback">Password must be at least 6 characters.</div>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-4">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="rememberMe" />
            <label class="form-check-label" for="rememberMe">Remember me</label>
          </div>
          <a href="#" class="link-accent text-decoration-none">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn-brand w-100 py-2 fw-semibold">
          <i class="fa-solid fa-right-to-bracket me-2"></i>Login
        </button>
      </form>

      <div class="divider my-4"><span>or continue with</span></div>

      <div class="d-grid gap-2 mb-4">
        <button class="btn btn-outline-dark btn-social"><i class="fa-brands fa-google me-2"></i>Continue with Google</button>
        <button class="btn btn-outline-dark btn-social"><i class="fa-brands fa-github me-2"></i>Continue with GitHub</button>
      </div>

      <p class="text-center text-muted mb-0">
        Don't have an account? <a href="register.html" class="link-accent text-decoration-none fw-semibold">Register here</a>
      </p>
    </div>
  </main>

  <!-- Bootstrap bundle JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Custom JS -->
  <script src="assets/js/auth.js"></script>
</body>
</html>
